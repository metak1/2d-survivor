# nginx in front of the game server (put this in /etc/nginx/sites-available/ and enable it).
# Get a certificate with certbot (`certbot --nginx -d game.example.com`), which adds the
# listen 443 / ssl lines. The Upgrade headers are what let the WebSocket at /ws through.

server {
    server_name game.example.com;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep idle game connections open (the server pings every 10s).
        proxy_read_timeout 120s;
    }
}
